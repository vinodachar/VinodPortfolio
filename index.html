    <script>
      // Apply saved motion preference before first paint (no flash).
      try {
        var m = localStorage.getItem("motion");
        if (m === "off" || (!m && matchMedia("(prefers-reduced-motion: reduce)").matches))
          document.documentElement.dataset.motion = "off";
